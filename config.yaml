# Konfiguration for vacuum-scraperen (brugte sikkerhedsstøvsugere, støvklasse H/M).
# Se scraper/scraper/models.py for selve model-whitelisten/blacklisten (for stor
# til at leve praktisk i YAML) og scraper/scraper/classify.py for antagelser
# lagt oven på specens tekst (filterestimat, 70%-af-nypris-tolkning osv.).

sources:
  dba: true
  guloggratis: true
  kleinanzeigen: true
  blocket: true
  vinted: false      # DEAKTIVERET 2026-09-29 (Opus-review): det offentlige
                     # /api/v2/*-endpoint svarer 404 på alt, bekræftet live
                     # (samme fund som modulets egen docstring fra 2026-09-19
                     # allerede advarede om -- ingen regression). En browser-
                     # baseret omvej VIRKER (156 hits på "nilfisk"), men
                     # udbuddet er forbrugerstøvsugere/robotstøvsugere/
                     # tilbehør (Dyson, Roomba, støvsugerposer), intet
                     # industri-H-klasse -- en Playwright-omskrivning (~80
                     # linjer + ny watchdog-timeout) betaler sig ikke for
                     # denne kategori. Se sources/vinted.py for detaljer.
  klaravik: true
  auktionshuset: true  # "dab.dk" i den oprindelige spec -- stærkeste fund ved research
  retrade: true        # lavt forventet udbytte (tung erhvervsmaskineri), se sources/retrade.py
  # GENOPTAGET 2026-09-30 (brugeren observerede selv flere relevante annoncer
  # der som ingen af de øvrige syv kilder kan finde -- Facebook Marketplace-
  # annoncer indekseres ikke andre steder). Kræver login (FACEBOOK_C_USER/
  # FACEBOOK_XS i .env, git-ignoreret) fra en DEDIKERET konto, ikke brugerens
  # primære -- se sources/facebook.py's docstring for den fulde risikomodel.
  # Fejler gracefult til [] hvis cookies mangler, så denne linje er sikker at
  # lade stå selv uden konfigureret session.
  facebook: true
  # BEVIDST UDELADT (se README.md):
  #  - ebay/tradera: kræver brugerens EGEN gratis developer-API-nøgle
  #    (developer.ebay.com / Tradera Open Platform) -- ikke registreret endnu.
  #  - campenauktioner.dk: midlertidigt utilgængelig ved research (side nede
  #    for opdatering) -- ingen selectors kunne bekræftes, prøv igen senere.
  #  - nettoauktion.dk: domænet findes ikke i praksis, droppet helt.

# Per-kilde min-interval (timer) -- Kleinanzeigen/Blocket øger blokeringsrisiko
# ved for hyppig hentning. Spec: "kør hver 6. time" er selve launchd-intervallet
# (se infra/launchd/scraper.template.plist), dette er et EKSTRA loft ovenpå.
# facebook: sat markant højere end de øvrige (24t) -- kontospærring er en langt
# alvorligere konsekvens end en midlertidig IP-blokering, og denne kilde er den
# eneste der bruger en rigtig, personlig login-session. Bevidst forsigtighed,
# ikke en teknisk nødvendighed.
sources_min_interval_hours:
  kleinanzeigen: 6
  blocket: 6
  vinted: 6
  facebook: 24

search_terms:
  # Specens egne generiske termer (agent-prompt "SØGETERMER"-sektion).
  primary:
    - "H-klasse støvsuger"
    - "sikkerhedsstøvsuger"
    - "asbestsuger"
    - "støvklasse H"
    - "Sicherheitssauger Klasse H"
    - "Asbestsauger"
    - "klass H"
    # NYE 2026-09-29 (Opus-review af intake): ÉT-ORDS kategori-substantiver.
    # Målt live samme dag mod de faktiske markedspladser:
    #  * "industristøvsuger" gav 53 træf på dba.dk -- klart det mest
    #    produktive enkeltord overhovedet, med bl.a. "Hilti VC 20H-X",
    #    "RONDA 80H 25", "Bygma ISC H-163 Safe" og "Bosch GAS 35" -- og det
    #    var samtidig ét af kun TO ord der overhovedet fandt noget på
    #    klaravik.dk. Det stod ikke i listen i forvejen; de syv ord ovenfor er
    #    enten flerords-fraser eller sjældne sammensætninger.
    #  * "Sicherheitssauger" alene er strengt bredere end
    #    "Sicherheitssauger Klasse H" ovenfor (som kræver tre ord på rad) og
    #    rammer kleinanzeigen-annoncer som "Asbest Sauger Sicherheitssauger H"
    #    og "NILFISK VHS010 EX Sicherheitssauger H Klasse".
    #  * "Industriesauger"/"industridammsugare" er de tyske/svenske former af
    #    det samme; begge optræder i rigtige, allerede-scrapede annoncer
    #    ("Werkstattsauger Starmix ISP iPulse ARH-1635 Staubklasse H",
    #    "Nilfisk industridammsugare med slang"), men var aldrig søgt efter.
    # Bevidst IKKE tilføjet globalt: bare mærkenavne ("Nilfisk", "Starmix").
    # Live-målt gav "Nilfisk" 54 træf på dba.dk med NUL H-klasse-maskiner
    # (højtryksrensere, vinduespudsere, Buddy/One/Elite-husholdnings-
    # støvsugere) og 5 træf på klaravik.dk, også nul relevante. Se
    # per_source nedenfor for den kildespecifikke undtagelse.
    - "industristøvsuger"
    - "Industriesauger"
    - "industridammsugare"
    - "Sicherheitssauger"
  # Modelwhitelistens ~85 mærke+model-kombinationer, søgt hver for sig (spec:
  # "søg hver enkelt separat"). Genereret fra scraper/scraper/models.py --
  # hold denne liste i sync hvis models.py's whitelist ændres (der er bevidst
  # ingen automatisk kodegenerering her, for at YAML'en forbliver menneske-
  # læselig og selvstændigt redigerbar uden at køre Python).
  #
  # PRIORITERET (2026-09-28, stovsuger-modeloversigt.md, afsnit 3A/3B/3C):
  # brugeren har bedt om at disse modeller -- den kuraterede, kildebelagte
  # gennemgang af hvad der reelt er asbestgodkendt -- prioriteres, så de
  # altid nås inden for watchdog-/søgebudgettet selv på en dårlig dag.
  # Samme model_keys er tagget med priority_stars i models.py (3=A/2=B/1=C),
  # se scraper.models.priority_model_keys(). De tre grupper herunder står
  # FØRST, i stjerne-rækkefølge (3A > 3B > 3C), resten af whitelisten følger
  # bagefter i uændret rækkefølge.
  secondary:
    # --- 3A: asbestgodkendt MED sikkerhedspose (★★★, bedste kategori) ---
    - "Nilfisk Attix 33-2H"
    - "Nilfisk Attix 30-0H"
    - "Nilfisk Attix 30-2H"
    - "Nilfisk Attix 44-2H"
    - "Nilfisk Attix 50-0H"
    - "Nilfisk Attix 751-0H"
    - "Nilfisk Attix 965"
    - "Nilfisk Attix 995"
    - "Nilfisk Attix 550-0H"
    - "Nilfisk IVB 5 H"
    - "Nilfisk IVB 7 H"
    - "Nilfisk IVB 965"
    - "Flex VCE 44 H AC"
    - "Ronda"  # brand-alene: modelnumre spreder sig for bredt (80H/200H/1800H/2800H)
    - "Bona DCS 25"
    - "Starmix ISC H-1225"
    # --- 3B: asbest tilladt, INGEN sikkerhedspose (★★) ---
    - "Nilfisk AERO 26-2H"
    - "Nilfisk AERO 21 H"
    # Ny 2026-09-29 (stovsuger-modeloversigt2.md -- brugerens version 3 --
    # afsnit 5 + 7A). Placeret her og ikke i 3A-gruppen ovenfor, selvom
    # dokumentets afsnit 7A-tabel har overskriften "med ... sikkerhedspose":
    # modellens EGEN række i den tabel har "Sikkerhedspose: ikke fundet", og
    # der citeres intet model-specifikt asbestbevis for den. Se models.py's
    # baier_bss608h-note. Afsnit 5 nævner den primært som LEJEmaskine.
    - "Baier BSS 608H"
    # --- 3C: H-klasse, men asbest forbudt eller gråzone (★) ---
    - "Metabo ASA 30 H PC"
    - "Metabo ASR 35 H ACP"
    - "Hilti VC 40H-X"
    - "Makita VC3211H"  # brugerens top-anbefaling ved negative asbestprøver
    - "Starmix ISC H-1625"
    - "Starmix iPulse H-1635 Safe Plus"
    - "Bygma ISC H-163 Safe"
    - "Starmix Energetic 1420 H"
    - "Starmix Energetic SX-110080 H"
    - "Bosch GAS 35 H AFC"
    - "Festool CTH 26"
    - "Festool CTH 48"
    # --- Resten af whitelisten (ikke i 3A/3B/3C, uændret prioritet) ---
    - "Kärcher NT 30/1 Tact Te H"
    - "Kärcher NT 30/1 Ap Te H"
    - "Kärcher NT 35/1 Tact Te H"
    - "Kärcher NT 50/1 Tact Te H"
    - "Kärcher NT 75/1 Tact Me H"
    - "Protool VCP 260 E-H"
    - "Protool VCP 480 E-H"
    - "Starmix ISC H 1425"
    - "Starmix ISC 1418 MINI H"
    - "Starmix ISC 1625 MPB H"
    - "Starmix iPulse ISP 1635 H"
    - "Starmix iPulse Safe 1635 EW H"
    - "Starmix iPulse H-1235"
    - "Starmix GS H-1232"
    - "Starmix HS AR-1635 EHP"
    - "Starmix Vaccufix H"
    - "Flex VCE 33 H AC"
    - "Eibenstock DSS 35 HIP"
    - "Numatic HZ200"
    - "Numatic HZ370"
    - "Numatic HZD750"
    - "Ermator S26"
    - "Ermator S36"
    - "Husqvarna S26"
    - "Dustcontrol DC Tromb 400 H"
    - "Ruwac NA7-26"
    # M-klasse SØGEORD BEVIDST FJERNET (Opus 5-gennemgang, 2026-09-20):
    # brugeren har afklaret at kun H-klasse reelt har interesse i praksis.
    # De 25 M-termer brugte ~1/3 af søgebudgettet (playwright.max_pages_total
    # deles af ALLE termer) og fandt PRÆCIS 1 M-annonce i hele det scrapede
    # datasæt indtil nu. M-modellerne er STADIG i models.py's MODEL_WHITELIST
    # (se scraper/scraper/models.py) -- de fungerer der som disambiguering/
    # blacklist (fx forhindrer "Attix 33-2M PC" i fejlagtigt at falde igennem
    # til known_brand_mentioned-fribilletten), ikke som aktive søgemål. En
    # M-annonce der matcher et af de øvrige H-fokuserede søgeord vil stadig
    # blive korrekt klassificeret som M, blot ikke aktivt opsøgt.

  # KILDESPECIFIKKE SUPPLEMENTER (nyt 2026-09-29, Opus-review af intake).
  # Søgeordene har indtil nu været fuldstændig globale -- main.py gav den
  # samme flade liste til alle otte kilder -- og to tidligere reviews flagede
  # at det blokerede for at hjælpe auktionskilderne uden at drukne de kilder
  # der allerede fungerer. Mekanikken ligger i search_terms.config_for_source()
  # (se dens docstring for de fulde live-målinger); termerne her lægges oven i
  # `primary` for NETOP den kilde og seedes ALDRIG til Turso's globale
  # search_terms-tabel.
  #
  # Kun klaravik og auktionshuset får noget. Begrundelse, live-målt 2026-09-29:
  #  * klaravik.dk: 0 træf på 'sikkerhedsstøvsuger', 0 på 'Nilfisk Attix
  #    33-2H' (et af vores 63 produktionssøgeord) -- men 1 træf på det bare
  #    'støvsuger', og det ene træf er netop den annonce brugeren efterlyste
  #    ("Industristøvsugere Electrostar Starmix IS 2 styk", 2.200 kr.).
  #    Klaravik matcher på DELSTRENG, så ét kort ord slår enhver frase.
  #  * auktionshuset.dk: 31 lots på det bare 'støvsuger' mod en håndfuld på
  #    fraserne. Lot-titlerne er "<Kategori> <MÆRKE> <model>"
  #    ("Industristøvsuger NILFISK ALTO AERO 20-21") og rammer derfor sjældent
  #    en flerords-frase.
  #  * dba/blocket/kleinanzeigen får bevidst INTET: de fungerer allerede med
  #    de specifikke modelfraser, og et bart 'støvsuger'/'Nilfisk' ville koste
  #    ~50 irrelevante annoncer pr. term af playwright.max_pages_total.
  #  * retrade.eu får bevidst INTET: seks brede termer gav tilsammen ÉT træf
  #    (fejemaskinen 'Nilfisk City Ranger 3500'), og 0 på både 'støvsuger' og
  #    'dammsugare'. Kilden har intet udbud i kategorien -- bredere søgning
  #    kan ikke finde noget der ikke er der.
  per_source:
    klaravik:
      - "støvsuger"
    auktionshuset:
      - "støvsuger"

vinted:
  max_results_per_term: 20
  timeout_s: 20
  min_delay_s: 5
  max_delay_s: 15

currency:
  eur_dkk: 7.46
  sek_dkk: 0.70
  nok_dkk: 0.64   # retrade.eu noterer norske auktions-lots i NOK (Opus-review 2026-09-29)
  usd_dkk: 6.90

# Import-omkostninger for sælgere UDENFOR EU/EØS. I praksis sjældent relevant
# for denne kategori (de fleste fund er DK/DE/SE), men beholdt for konsistens
# med boilerplate-mønsteret og for evt. fremtidige ikke-EU-fund.
import_costs:
  vat_pct: 25
  duty_threshold_eur: 150
  duty_pct: 2.7          # HS-kode 8508 (støvsugere) -- IKKE bekræftet præcist, se PASPEAKERS' tilsvarende advarsel
  default_shipping_dkk: 500
  eu_country_codes:
    - DK
    - DE
    - SE
    - AT
    - BE
    - BG
    - HR
    - CY
    - CZ
    - EE
    - ES
    - FI
    - FR
    - GR
    - HU
    - IE
    - IT
    - LT
    - LU
    - LV
    - MT
    - NL
    - PL
    - PT
    - RO
    - SI
    - SK

# Fast beløb lagt oveni landed_price_dkk før sammenligning med prislofterne
# nedenfor, MEDMINDRE annoncen selv nævner et nyt/nyligt skiftet filter --
# se classify.py's docstring for den fulde begrundelse (spec: "regn 700-900
# kr. oveni til nyt H-filterelement PÅ ENHVER BRUGT MASKINE").
filter_replacement_estimate_dkk: 800

# Prisbund for det SVAGESTE kandidat-signal (kendt mærke + industri-kategori,
# men hverken modelnummer eller klassebogstav) -- se classify.py's lange
# kommentar over _kandidat_signal() for målingerne. Gælder BEVIDST kun det ene
# trin: en annonce med et klassebogstav eller et modelnummer beholdes uanset
# pris, så et ægte røverkøb (fx "Flex-industristøversuger VCE44-AC H-klasse"
# til 500 kr., set i live-data) aldrig tabes. Sat til samme beløb som
# filter_replacement_estimate_dkk ovenfor, fordi begrundelsen er den samme:
# en maskine der koster mindre end det H-filterelement man er nødt til at
# sætte i den, er ikke en seriøs kandidat. En pris på None (auktion uden bud
# endnu) rammes ikke af bunden.
minimumspris_svagt_signal_dkk: 800

# PRISLOFTER (spec, DKK, inkl. evt. transport + filterestimat ovenfor).
# koeb_max = aldrig køb over denne pris. god_handel_max = under denne pris
# kan annoncen (sammen med opfyldte hårde krav) blive "køb nu" uden yderligere
# due diligence -- se classify.py.
prislofter:
  kompakt_h:   # 25-35 l
    koeb_max: 3500
    god_handel_max: 2500
  stor_h:      # 40-75 l
    koeb_max: 5000
    god_handel_max: 3500
  m_klasse:    # 30-45 l
    koeb_max: 2000
    god_handel_max: 1200

playwright:
  # true = ingen synlige Chrome-vinduer (Playwright 1.61+'s nye headless-
  # tilstand er markant sværere at fingeraftrykke, se seng/PASPEAKERS' samme valg).
  headless: true
  min_delay_s: 3
  max_delay_s: 8
  max_pages_per_term: 3
  # 68 søgetermer (11 generiske + 57 modelspecifikke, opdateret 2026-09-29;
  # klaravik+auktionshuset får ét ekstra kildespecifikt ord, se per_source) på
  # tværs af 6 Playwright-baserede kilder -- sat højt nok til at nå hele
  # listen inden for ét launchd-interval (6 timer), se main.py's
  # SOURCE_TIMEOUT_OVERRIDES for Kleinanzeigens separate watchdog-forlængelse.
  max_pages_total: 80

db_path: "./data/local.db"
