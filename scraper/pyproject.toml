[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vacuum-scraper"
version = "0.1.0"
description = "Monitors used H/M-class safety vacuum cleaner (sikkerhedsstøvsuger) listings across dba.dk, guloggratis.dk, kleinanzeigen.de, blocket.se, vinted.dk, klaravik.dk, auktionshuset.dk and retrade.eu."
requires-python = ">=3.11"
dependencies = [
    "scraper-core>=0.1.0",
    "requests>=2.31",
    "playwright>=1.44",
    "pyyaml>=6.0",
]

[project.scripts]
scraper-run = "scraper.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["scraper*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
