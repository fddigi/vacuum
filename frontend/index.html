<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <title>Sikkerhedsstøvsugere</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f7f7f5; --card: #fff; --border: #e2e2df; --text: #1c1c1a; --muted: #6b6b66;
      --koeb: #1a7a3c; --koeb-bg: #e6f5eb; --se: #a8730a; --se-bg: #fdf1dd;
      --afvis: #999; --afvis-bg: #f0f0ee;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .topbar { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    select, button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); }
    button { cursor: pointer; }
    .cards { display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .card-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .card-main { flex: 1; min-width: 0; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
    .badge.koeb { color: var(--koeb); background: var(--koeb-bg); }
    .badge.se { color: var(--se); background: var(--se-bg); }
    .badge.afvis { color: var(--afvis); background: var(--afvis-bg); }
    .title { font-weight: 600; font-size: 1.02rem; }
    .title a { color: inherit; text-decoration: none; }
    .title a:hover { text-decoration: underline; }
    .meta { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
    .price { font-size: 1.15rem; font-weight: 700; white-space: nowrap; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag { font-size: 0.75rem; padding: 2px 8px; border-radius: 6px; background: var(--afvis-bg); color: var(--text); }
    .missing { margin-top: 8px; font-size: 0.85rem; color: var(--se); }
    .missing ul { margin: 4px 0 0; padding-left: 18px; }
    details { margin-top: 8px; }
    summary { cursor: pointer; font-size: 0.85rem; color: var(--muted); }
    #error { color: #b3261e; }
    #empty { color: var(--muted); padding: 24px 0; }
    .card-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .dismiss-btn { font-size: 0.8rem; padding: 4px 10px; }
    .dismissed-badge { font-size: 0.78rem; color: #a33; }
    .card.is-dismissed { opacity: 0.6; }
    .checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; }
    .sources-box { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); }
    .sources-box .sources-label { color: var(--muted); font-size: 0.8rem; }
    .badge.prioritet { color: #8a5a00; background: #fff2d1; }
    .thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); flex-shrink: 0; background: var(--bg); }
    .category-tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .category-tab { font: inherit; padding: 8px 16px; border: none; background: none; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
    .category-tab.active { color: var(--text); font-weight: 600; border-bottom-color: var(--text); }
    .category-tab[disabled] { color: #ccc; cursor: default; }
    .dim-filter { width: 128px; }
    .badge.stale { color: #8a5a00; background: #fff2d1; }
  </style>
</head>
<body>
  <!-- Kategori-faneblade (2026-10-03/05): "vacuum" dækker nu hele SHV-
       sourcingen, ikke kun sikkerhedsstøvsugere -- se
       scraper/scraper/categories.py's docstring. Kun to kategorier har reelt
       data/backend endnu (stoevsugere/doere); resten vises deaktiveret som
       en synlig markør af hvad der er planlagt. -->
  <div class="category-tabs">
    <button class="category-tab active" data-category="stoevsugere">🧹 Sikkerhedsstøvsugere</button>
    <button class="category-tab" data-category="doere">🚪 Døre</button>
    <button class="category-tab" disabled title="Under opbygning">🔥 Brandvinduer</button>
  </div>

  <div class="topbar">
    <div>
      <h1 id="page-title">Sikkerhedsstøvsugere (støvklasse H/M)</h1>
      <div class="meta">Logget ind som <span id="whoami">...</span> · <button id="logout">log ud</button></div>
    </div>
    <div class="filters">
      <select id="filter-vurdering">
        <option value="">Alle vurderinger</option>
        <option value="køb nu">Køb nu</option>
        <option value="se nærmere">Se nærmere</option>
        <option value="afvis">Afvist</option>
      </select>
      <span id="filters-stoevsugere">
        <select id="filter-klasse">
          <option value="H" selected>Kun H-klasse</option>
          <option value="">Alle klasser (inkl. M)</option>
        </select>
        <label class="checkbox-label" title="Støvklasse bekræftet via et faktisk modelnavn-match, ikke kun mærkeomtale. Uafhængig af vurdering (køb nu/se nærmere/afvis) - en valideret maskine kan sagtens være afvist på pris.">
          <input type="checkbox" id="show-validated-only" /> Kun validerede
        </label>
      </span>
      <!-- Døre har ingen backend-filtrering på mål endnu (attributes_json
           er en JSON-blob, ikke forespørgelige kolonner) -- min/max anvendes
           derfor klient-side på det allerede hentede resultat, se
           applyDoorDimensionFilter() nedenfor. Dette var selve opdraget:
           "kan ikke søge på mål på DBA", nu løst i vores eget dashboard. -->
      <span id="filters-doere" style="display: none">
        <input type="number" class="dim-filter" id="filter-width-min" placeholder="Bredde min cm" />
        <input type="number" class="dim-filter" id="filter-width-max" placeholder="Bredde max cm" />
        <input type="number" class="dim-filter" id="filter-height-min" placeholder="Højde min cm" />
        <input type="number" class="dim-filter" id="filter-height-max" placeholder="Højde max cm" />
      </span>
      <select id="sort">
        <option value="price_asc">Sortér: billigst</option>
        <option value="newest">Sortér: nyeste</option>
        <option value="priority">Sortér: prioritet</option>
      </select>
      <label class="checkbox-label" title="Dismissed = diskvalificeret af DIG manuelt. Ikke det samme som vurdering 'afvis' (automatisk klassificering), se dropdownen til venstre.">
        <input type="checkbox" id="show-dismissed" /> Vis diskvalificerede
      </label>
      <label class="checkbox-label" title="Formodet solgt: annoncen er ikke genfundet i 3 kørsler i træk, eller ikke set i 48+ timer, eller (kun kleinanzeigen) bekræftet slettet/reserveret ved et direkte genbesøg. Skjules som standard, men ALDRIG slettet -- bruges til prishistorik.">
        <input type="checkbox" id="show-stale" /> Vis også formodet solgte
      </label>
      <button id="refresh">Opdatér</button>
    </div>
  </div>

  <!-- Kilder håndteres UAFHÆNGIGT af hinanden (afkrydsningsfelter, ikke én
       fælles dropdown) -- se sources-config nedenfor for hvorfor kleinanzeigen
       er slået fra som default. -->
  <div class="sources-box" id="sources-box">
    <span class="sources-label">Kilder:</span>
  </div>
  <div style="height: 12px"></div>

  <div id="cards" class="cards"></div>
  <p id="empty" style="display: none">Ingen annoncer matcher filtret endnu.</p>
  <p id="error"></p>

  <script src="config.js"></script>
  <script>
    function authHeaders() {
      const token = localStorage.getItem("session_token");
      return token ? { Authorization: `Bearer ${token}` } : {};
    }

    async function requireSession() {
      if (!localStorage.getItem("session_token")) {
        window.location.href = "login.html";
        return null;
      }
      const res = await fetch(`${API_BASE}/api/me`, { headers: authHeaders() });
      if (!res.ok) {
        localStorage.removeItem("session_token");
        window.location.href = "login.html";
        return null;
      }
      return res.json();
    }

    function parseJsonArray(text) {
      try {
        const value = JSON.parse(text || "[]");
        return Array.isArray(value) ? value : [];
      } catch {
        return [];
      }
    }

    // XSS-hærdning (2026-10-05, fundet af en Opus-valideringsagent): title/
    // location/source/url/image_url/brand/model_label/dust_class/
    // klasse_kilde/mangler_info/spoergsmaal_til_saelger/medfoelger/
    // fire_rating kommer alle fra TREDJEPARTS marketplace-tekst (sælgerens
    // egen titel m.m.), som tidligere gik direkte i innerHTML uden
    // escaping. Ingen af de ~2700 rækker i databasen i dag indeholder "<"
    // eller """, men en sælgers titel er ikke under vores kontrol -- en
    // fremtidig annonce med fx et "<img onerror=...>" i titlen ville
    // eksekveres. Escapes derfor konsekvent ved brug, ikke kun hvor en
    // konkret udnyttelse allerede er observeret.
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    function badgeClass(vurdering) {
      if (vurdering === "køb nu") return "koeb";
      if (vurdering === "se nærmere") return "se";
      return "afvis";
    }

    // Kilder håndteres uafhængigt af hinanden (2026-09-28): hver kilde er sit
    // eget afkrydsningsfelt, ikke ét fælles dropdown-valg. kleinanzeigen.de
    // starter SLUKKET som default -- brugerens egen erfaring: "næsten alle
    // annoncer her er 'kun afhentning'" (upraktisk for en dansk køber på et
    // tysk marketplace). Alle andre kilder starter TÆNDT. Valget huskes i
    // browseren (localStorage), så det ikke nulstilles ved hvert besøg.
    // RETTET 2026-10-01: "facebook" manglede fra denne liste (tilføjet som
    // kilde 2026-09-30, EFTER denne liste blev skrevet). Konsekvensen var
    // værre end "ingen toggle" -- fordi kleinanzeigen starter slukket,
    // sendte loadListings() allerede en EKSPLICIT ?sources=-liste ved hvert
    // besøg (se "sources.length < allSources().length" nedenfor), og den
    // liste kendte ikke facebook, så Facebook-fund blev tavst filtreret væk
    // for enhver bruger der nogensinde har haft kleinanzeigen slået fra.
    // SAMME FEJLKLASSE RETTET IGEN 2026-10-05 for "jyskauktion".
    // Kilder er nu PR. KATEGORI (2026-10-05) -- "doere" har kun genbyg+dba
    // aktiveret i config.doere.yaml, mens "stoevsugere" har ni kilder. Hver
    // kategori har sin egen localStorage-nøgle, så et til/fra-valg for
    // "dba" under støvsugere ikke påvirker "dba" under døre eller omvendt.
    // RETTET 2026-10-05: "jyskauktion" manglede fra denne liste (tilføjet
    // som kilde 2026-10-03/04, EFTER denne liste blev skrevet) -- samme
    // fejlklasse som den tidligere facebook-mangel (se commit-historik).
    // RETTET IGEN 2026-10-10 for "jk_genbrugscenter" -- tredje gang samme
    // fejlklasse rammer: en ny backend-kilde (config.doere.yaml) glemmes i
    // denne hardkodede frontend-liste, fordi de to filer redigeres hver for
    // sig. Overvej et fælles /api/sources-endpoint hvis dette sker en 4. gang.
    const CATEGORY_SOURCES = {
      stoevsugere: [
        "dba",
        "guloggratis",
        "kleinanzeigen",
        "blocket",
        "vinted",
        "klaravik",
        "auktionshuset",
        "retrade",
        "facebook",
        "jyskauktion",
      ],
      doere: ["genbyg", "dba", "jk_genbrugscenter"],
    };
    const CATEGORY_LABELS = { stoevsugere: "Sikkerhedsstøvsugere", doere: "Døre" };
    const CATEGORY_TITLES = {
      stoevsugere: "Sikkerhedsstøvsugere (støvklasse H/M)",
      doere: "Døre (branddøre, indvendige døre, yderdøre)",
    };
    const SOURCES_OFF_BY_DEFAULT = new Set(["kleinanzeigen"]);
    // Default-vurdering pr. kategori (2026-10-05, bruger-rapport: "ser
    // stadig drikkeglas ... og ingen branddøre"): døre-kategorien har (i
    // modsætning til støvsugere) ingen etableret "køb nu"-tærskel, og
    // KLASSIFICERER derfor en stor andel irrelevante træf korrekt som
    // "afvis" i stedet for slet ikke at gemme dem (se doere_classify.py's
    // docstring). Med standard-filtret "Alle vurderinger" + "Sortér:
    // billigst" druknede de facto-korrekt afviste, meget billige glas-/
    // tilbehørsrækker (fra 1 kr.) de rigtige branddøre/-vinduer (typisk
    // 150+ kr.) på de første skærmfulde. "Se nærmere" er stadig kun ÉT
    // klik væk i dropdownen, intet er skjult permanent.
    const CATEGORY_DEFAULT_VURDERING = { stoevsugere: "", doere: "se nærmere" };
    let activeCategory = "stoevsugere";

    function allSources() {
      return CATEGORY_SOURCES[activeCategory];
    }

    function sourcesStorageKey() {
      return `vacuum_source_filters_v1_${activeCategory}`;
    }

    function loadSourcePrefs() {
      try {
        const raw = localStorage.getItem(sourcesStorageKey());
        if (raw) return JSON.parse(raw);
      } catch {
        // ignoreres -- falder tilbage til default herunder
      }
      const defaults = {};
      for (const s of allSources()) defaults[s] = !SOURCES_OFF_BY_DEFAULT.has(s);
      return defaults;
    }

    function saveSourcePrefs(prefs) {
      try {
        localStorage.setItem(sourcesStorageKey(), JSON.stringify(prefs));
      } catch {
        // ignoreres -- kun en bekvemmelighed, ikke kritisk tilstand
      }
    }

    function renderSourceCheckboxes() {
      const box = document.getElementById("sources-box");
      box.innerHTML = '<span class="sources-label">Kilder:</span>';
      const prefs = loadSourcePrefs();
      for (const source of allSources()) {
        const label = document.createElement("label");
        label.className = "checkbox-label";
        if (source === "kleinanzeigen") {
          label.title = "Slået fra som default: næsten alle kleinanzeigen.de-annoncer er 'kun afhentning' i Tyskland.";
        }
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = prefs[source] !== false;
        checkbox.dataset.source = source;
        checkbox.addEventListener("change", () => {
          const updated = loadSourcePrefs();
          updated[source] = checkbox.checked;
          saveSourcePrefs(updated);
          loadListings();
        });
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(" " + source));
        box.appendChild(label);
      }
    }

    function checkedSources() {
      return [...document.querySelectorAll("#sources-box input[type=checkbox]")]
        .filter((cb) => cb.checked)
        .map((cb) => cb.dataset.source);
    }

    function switchCategory(category) {
      if (category === activeCategory) return;
      activeCategory = category;
      document.querySelectorAll(".category-tab").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.category === category);
      });
      document.getElementById("page-title").textContent = CATEGORY_TITLES[category] ?? CATEGORY_LABELS[category];
      document.title = CATEGORY_LABELS[category] ?? document.title;
      document.getElementById("filters-stoevsugere").style.display = category === "stoevsugere" ? "" : "none";
      document.getElementById("filters-doere").style.display = category === "doere" ? "" : "none";
      document.getElementById("filter-vurdering").value = CATEGORY_DEFAULT_VURDERING[category] ?? "";
      renderSourceCheckboxes();
      loadListings();
    }

    function priorityBadge(stars) {
      const n = Number(stars) || 0;
      if (n <= 0) return "";
      const label = { 3: "★★★ prioriteret (A)", 2: "★★ prioriteret (B)", 1: "★ prioriteret (C)" }[n] ?? "";
      return `<span class="badge prioritet" title="stovsuger-modeloversigt.md, afsnit 3">${label}</span>`;
    }

    function formatBool(value) {
      if (value === "true") return "ja";
      if (value === "false") return "nej";
      return "ukendt";
    }

    async function setDismissed(itemKey, dismissed) {
      const path = dismissed ? "dismiss" : "undismiss";
      const res = await fetch(`${API_BASE}/api/listings/${encodeURIComponent(itemKey)}/${path}`, {
        method: "POST",
        headers: authHeaders(),
      });
      if (!res.ok) {
        document.getElementById("error").textContent = "Kunne ikke opdatere annoncen.";
        return false;
      }
      return true;
    }

    function doorTags(row) {
      // Dør-attributter ligger i attributes_json (generisk JSON-blob, se
      // pipeline.py), IKKE i de navngivne støvsuger-kolonner (dust_class
      // osv.), som altid er NULL for category="doere".
      let attrs = {};
      try {
        attrs = JSON.parse(row.attributes_json || "{}") || {};
      } catch {
        attrs = {};
      }
      const width = attrs.width_cm;
      const height = attrs.height_cm;
      const thickness = attrs.thickness_cm;
      const fireRating = attrs.fire_rating;
      const dims = width && height ? `${width} × ${height} cm` : width || height ? `${width ?? "?"} × ${height ?? "?"} cm` : null;
      return `
        ${dims ? `<span class="tag">Mål: ${escapeHtml(dims)}</span>` : `<span class="tag">Mål: ukendt</span>`}
        ${thickness ? `<span class="tag">Tykkelse: ${escapeHtml(thickness)} cm</span>` : ""}
        ${fireRating ? `<span class="tag">Brandklasse: ${escapeHtml(fireRating)}</span>` : ""}
      `;
    }

    function doorDimensions(row) {
      try {
        const attrs = JSON.parse(row.attributes_json || "{}") || {};
        return { width: attrs.width_cm ?? null, height: attrs.height_cm ?? null };
      } catch {
        return { width: null, height: null };
      }
    }

    function renderCard(row) {
      const card = document.createElement("div");
      card.className = "card" + (row.dismissed ? " is-dismissed" : "");

      const missing = parseJsonArray(row.mangler_info);
      const questions = parseJsonArray(row.spoergsmaal_til_saelger);
      const accessories = parseJsonArray(row.medfoelger);
      const isDoor = row.category === "doere";

      const priceText = row.price_dkk != null ? `${Math.round(row.price_dkk).toLocaleString("da-DK")} kr.` : "pris ukendt";
      const ageFlag = row.forhandlingsmulighed ? ` · <span class="tag">30+ dage &rarr; forhandlingsmulighed</span>` : "";
      const dismissedBadge = row.dismissed
        ? `<span class="dismissed-badge">(afvist${row.dismissed_reason === "manual" ? " manuelt" : ""})</span>`
        : "";
      const validatedBadge = row.valideret
        ? `<span class="badge koeb" title="Støvklasse bekræftet via modelnavn-match">✓ valideret</span>`
        : "";
      const staleBadge = row.stale
        ? `<span class="badge stale" title="Formodet solgt/forsvundet -- se 'Vis også formodet solgte'-tjekboksen">formodet solgt</span>`
        : "";

      // Thumbnail (2026-10-05): kun DBA og jyskauktion opsamler et billede
      // pt. -- se sources/dba.py og sources/jyskauktion.py's docstrings.
      // Nullable for alle øvrige kilder, så feltet vises kun når det findes.
      const thumb = row.image_url
        ? `<img class="thumb" src="${escapeHtml(row.image_url)}" alt="" loading="lazy" onerror="this.remove()">`
        : "";

      card.innerHTML = `
        <div class="card-top">
          ${thumb}
          <div class="card-main">
            <span class="badge ${badgeClass(row.vurdering)}">${escapeHtml(row.vurdering ?? "ukendt")}</span>
            ${isDoor ? "" : validatedBadge}
            ${isDoor ? "" : priorityBadge(row.prioritet)}
            ${staleBadge}
            ${dismissedBadge}
            <div class="title"><a href="${escapeHtml(row.url)}" target="_blank" rel="noopener">${escapeHtml(row.title) || "(uden titel)"}</a></div>
            <div class="meta">${escapeHtml(row.source)}${row.location ? " · " + escapeHtml(row.location) : ""} · score ${row.score ?? 0}${ageFlag}</div>
          </div>
          <div class="price">${priceText}</div>
        </div>
        <div class="tags">
          ${isDoor ? doorTags(row) : `
          ${row.brand ? `<span class="tag">${escapeHtml(row.brand)} ${escapeHtml(row.model_label ?? "")}</span>` : ""}
          <span class="tag">Klasse: ${escapeHtml(row.dust_class ?? "ukendt")}${row.klasse_kilde ? " (" + escapeHtml(row.klasse_kilde) + ")" : ""}</span>
          <span class="tag">Asbestgodkendt: ${formatBool(row.asbestos_approved)}</span>
          ${row.container_l ? `<span class="tag">${escapeHtml(row.container_l)} l</span>` : ""}
          ${row.battery ? `<span class="tag">Batteri</span>` : ""}
          <span class="tag">Filterrens: ${escapeHtml(row.filterrensning ?? "ukendt")}</span>
          `}
          ${accessories.length ? `<span class="tag">Medfølger: ${escapeHtml(accessories.join(", "))}</span>` : ""}
        </div>
        ${missing.length ? `<div class="missing"><strong>Mangler info:</strong><ul>${missing.map((m) => `<li>${escapeHtml(m)}</li>`).join("")}</ul></div>` : ""}
        ${questions.length ? `<details><summary>Spørgsmål til sælger (${questions.length})</summary><ul>${questions.map((q) => `<li>${escapeHtml(q)}</li>`).join("")}</ul></details>` : ""}
        <div class="card-actions">
          <button class="dismiss-btn" type="button">${row.dismissed ? "Genskab" : "Diskvalificér"}</button>
        </div>
      `;

      card.querySelector(".dismiss-btn").addEventListener("click", async () => {
        const next = !row.dismissed;
        const ok = await setDismissed(row.item_key, next);
        if (ok) {
          row.dismissed = next ? 1 : 0;
          row.dismissed_reason = next ? "manual" : null;
          // Hvis "Vis afviste" er slået fra, skal en netop diskvalificeret
          // annonce forsvinde fra visningen med det samme, uden en ny fetch.
          if (next && !document.getElementById("show-dismissed").checked) {
            card.remove();
          } else {
            card.replaceWith(renderCard(row));
          }
        }
      });

      return card;
    }

    // Dør-mål-filtrering (2026-10-05): dette var selve det oprindelige
    // opdrag ("man kan ikke søge på mål på DBA") -- løst klient-side her,
    // da attributes_json er en JSON-blob i databasen, ikke forespørgelige
    // kolonner Workeren kan filtrere på endnu.
    function applyDoorDimensionFilter(listings) {
      if (activeCategory !== "doere") return listings;
      const widthMin = parseFloat(document.getElementById("filter-width-min").value);
      const widthMax = parseFloat(document.getElementById("filter-width-max").value);
      const heightMin = parseFloat(document.getElementById("filter-height-min").value);
      const heightMax = parseFloat(document.getElementById("filter-height-max").value);
      if ([widthMin, widthMax, heightMin, heightMax].every((v) => Number.isNaN(v))) {
        return listings;
      }
      return listings.filter((row) => {
        const { width, height } = doorDimensions(row);
        if (!Number.isNaN(widthMin) && (width == null || width < widthMin)) return false;
        if (!Number.isNaN(widthMax) && (width == null || width > widthMax)) return false;
        if (!Number.isNaN(heightMin) && (height == null || height < heightMin)) return false;
        if (!Number.isNaN(heightMax) && (height == null || height > heightMax)) return false;
        return true;
      });
    }

    async function loadListings() {
      const params = new URLSearchParams();
      params.set("category", activeCategory);
      // Loftet på 500 (Workerens default) gjorde dør-målfiltreringen
      // reelt ubrugelig: filtret kører klient-side (se
      // applyDoorDimensionFilter) på de hentede rækker, men med 1178+
      // dørannoncer og default-sortering "billigst" var op til 77% af et
      // reelt mål-match uden for de 500 billigste og dermed usynligt.
      // 2000 er Workerens eget hårde loft (se worker/src/index.ts) og
      // dækker begge kategoriers fulde beholdning i dag.
      params.set("limit", "2000");
      const vurdering = document.getElementById("filter-vurdering").value;
      const sources = checkedSources();
      const sort = document.getElementById("sort").value;
      const showDismissed = document.getElementById("show-dismissed").checked;
      const showStale = document.getElementById("show-stale").checked;
      if (vurdering) params.set("vurdering", vurdering);
      // Kun send "sources" når ikke ALLE kilder er valgt -- undgår en
      // unødvendigt lang querystring i det (langt hyppigste) tilfælde hvor
      // brugeren ikke har afkrydset noget fra.
      if (sources.length > 0 && sources.length < allSources().length) {
        params.set("sources", sources.join(","));
      } else if (sources.length === 0) {
        // Alle kilder fravalgt -- bed eksplicit om en kilde der ikke findes,
        // så resultatet bliver tomt i stedet for (fejlagtigt) "alle kilder".
        params.set("sources", "__none__");
      }
      // H-klasse og "kun validerede" er kun relevante for stoevsugere --
      // felterne findes slet ikke i DOM'en for døre (se filters-doere).
      if (activeCategory === "stoevsugere") {
        const klasse = document.getElementById("filter-klasse").value;
        if (klasse) params.set("dust_class", klasse);
        if (document.getElementById("show-validated-only").checked) params.set("validated", "1");
      }
      params.set("sort", sort);
      if (showDismissed) params.set("include_dismissed", "1");
      if (showStale) params.set("include_stale", "1");

      const res = await fetch(`${API_BASE}/api/listings?${params.toString()}`, { headers: authHeaders() });
      if (!res.ok) {
        document.getElementById("error").textContent = "Kunne ikke hente data.";
        return;
      }
      const { listings: rawListings } = await res.json();
      const listings = applyDoorDimensionFilter(rawListings);
      const container = document.getElementById("cards");
      container.innerHTML = "";
      document.getElementById("empty").style.display = listings.length ? "none" : "block";
      for (const row of listings) {
        container.appendChild(renderCard(row));
      }
    }

    document.querySelectorAll(".category-tab[data-category]").forEach((btn) => {
      btn.addEventListener("click", () => switchCategory(btn.dataset.category));
    });

    document.getElementById("filter-vurdering").addEventListener("change", loadListings);
    document.getElementById("filter-klasse").addEventListener("change", loadListings);
    document.getElementById("sort").addEventListener("change", loadListings);
    document.getElementById("show-dismissed").addEventListener("change", loadListings);
    document.getElementById("show-validated-only").addEventListener("change", loadListings);
    document.getElementById("show-stale").addEventListener("change", loadListings);
    document.getElementById("refresh").addEventListener("click", loadListings);
    // Debounced (300ms): uden dette udløste hvert enkelt tastetryk i et
    // mål-felt sit eget fulde API-kald (fundet af en Opus-valideringsagent,
    // 2026-10-05) -- at taste "200" gav tre kald i stedet for ét.
    let dimFilterTimer = null;
    for (const id of ["filter-width-min", "filter-width-max", "filter-height-min", "filter-height-max"]) {
      document.getElementById(id).addEventListener("input", () => {
        clearTimeout(dimFilterTimer);
        dimFilterTimer = setTimeout(loadListings, 300);
      });
    }

    document.getElementById("logout").addEventListener("click", async () => {
      await fetch(`${API_BASE}/logout`, { method: "POST", headers: authHeaders() }).catch(() => {});
      localStorage.removeItem("session_token");
      window.location.href = "login.html";
    });

    (async () => {
      const me = await requireSession();
      if (!me) return;
      document.getElementById("whoami").textContent = me.username;
      renderSourceCheckboxes();
      await loadListings();
    })();
  </script>
</body>
</html>
