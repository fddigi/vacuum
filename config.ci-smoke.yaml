# CI-only fixture: ALLE kilder deaktiveret. Bruges af .github/workflows/ci.yml's
# smoke test (via VACUUM_CONFIG_PATH) så selve maskinrummet (settings, LocalStore,
# schema-oprettelse, graceful lokal-only-fallback) afprøves ved hvert push/PR uden
# nogensinde at ramme de otte rigtige, rate-limited/bot-beskyttede markedspladser.
sources:
  dba: false
  guloggratis: false
  kleinanzeigen: false
  blocket: false
  vinted: false
  klaravik: false
  auktionshuset: false
  retrade: false

search_terms:
  primary: []
  secondary: []

currency:
  eur_dkk: 7.46
  sek_dkk: 0.70
  usd_dkk: 6.90

import_costs:
  vat_pct: 25
  duty_threshold_eur: 150
  duty_pct: 2.7
  default_shipping_dkk: 500
  eu_country_codes: [DK, DE, SE]

filter_replacement_estimate_dkk: 800
prislofter:
  kompakt_h: {koeb_max: 3500, god_handel_max: 2500}
  stor_h: {koeb_max: 5000, god_handel_max: 3500}
  m_klasse: {koeb_max: 2000, god_handel_max: 1200}

playwright:
  headless: true
  min_delay_s: 1
  max_delay_s: 2
  max_pages_per_term: 1
  max_pages_total: 1

db_path: "./data/local.db"
