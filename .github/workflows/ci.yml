name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (ruff + tests + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper-core
        run: pip install -e "packages/scraper-core[dev]"

      - name: Install scraper
        run: pip install -e "scraper[dev]"

      - name: Ruff lint
        run: ruff check packages/scraper-core scraper

      - name: Unit tests (delta-sync logic, mocked Turso client)
        run: pytest packages/scraper-core/tests -q

      - name: Unit tests (model whitelist/blacklist, scoring engine)
        run: pytest scraper/tests -q

      - name: Import smoke test
        run: python -c "import scraper_core, scraper.main; print('import OK')"

      - name: Local SQLite schema + scrape smoke test
        # All 8 real sources hit live, rate-limited/bot-protected marketplaces
        # (dba.dk, kleinanzeigen.de, etc.) - running them unmodified on every
        # push/PR from GitHub's shared CI IP range would risk that IP range
        # getting blocklisted for everyone, not just this repo. config.ci-
        # smoke.yaml (VACUUM_CONFIG_PATH override) disables every source, so
        # this only exercises settings/LocalStore/schema/graceful-fallback
        # plumbing - no live network calls to the actual marketplaces.
        run: |
          rm -f data/ci-smoke.db
          LOCAL_SQLITE_PATH=./data/ci-smoke.db VACUUM_CONFIG_PATH=./config.ci-smoke.yaml python -m scraper.main

  worker:
    name: Worker (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      # Matches bootstrap.yml/deploy.yml's pin - wrangler@4.110.0 requires Node >=22.
      # This job doesn't call wrangler directly (only tsc/vitest), so it likely
      # wasn't broken by the mismatch, but keeping all three workflows on the same
      # Node version avoids relearning this the hard way in a fourth place later.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: "Unit tests (auth: password hash + session token signing)"
        run: npx vitest run

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Calls the gitleaks CLI directly instead of gitleaks/gitleaks-action -
      # the Action wrapper now requires a paid GITLEAKS_LICENSE secret for
      # organization accounts (a business-model change in the wrapper, not in
      # gitleaks itself, which is still free/open source). This job failed on
      # every single push for an entire real project's migration before this
      # fix - it never blocked deploy.yml (separate workflow), so the failure
      # was easy to miss.
      #
      # Pinned to a specific version (not "latest") for the same reason
      # wrangler is pinned elsewhere in this template: an unpinned tag/release
      # can change behavior (or, as happened here, licensing terms) without
      # warning. Bump deliberately, not automatically.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz gitleaks

      - name: Run gitleaks
        run: ./gitleaks detect --source . --verbose --redact
